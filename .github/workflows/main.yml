name: Daily Commit Job

on:
  schedule:
    - cron: '10 4 * * *'  # Runs daily at 04:10 UTC
  workflow_dispatch:       # Optional manual trigger

jobs:
  commit-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: 23f3003281@ds.study.iitm.ac.in
        run: echo "Automated commit at $(date -u)" >> daily-log.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "tanmaypatil1311"
          git config --global user.email "tanmaypatil1311@gmail.com"
          git add daily-log.txt
          git commit -m "Daily automated commit at $(date -u)" || echo "Nothing to commit"
          git push
