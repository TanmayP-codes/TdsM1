name: Daily Commit Job

on:
  schedule:
    - cron: '10 4 * * *'  # Daily at 04:10 UTC
  workflow_dispatch:

jobs:
  commit-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: 23f3003281@ds.study.iitm.ac.in
        run: echo "Automated commit at $(date -u)" >> daily-log.txt

      - name: Commit and Push Changes
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "Tanmay Bot"
          git config --global user.email "tanmaypatil1311@gmail.com"  # optional
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}
          git add daily-log.txt
          git commit -m "Daily automated commit at $(date -u)" || echo "Nothing to commit"
          git push origin main
